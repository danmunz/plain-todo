name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme PlainApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath ./build/Plain.xcarchive \
            -quiet

      - name: Package
        run: |
          cd ./build/Plain.xcarchive/Products/Applications
          zip -r -y ../../../../Plain-${{ github.ref_name }}-macOS.zip Plain.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Plain-${{ github.ref_name }}-macOS.zip
          generate_release_notes: true
