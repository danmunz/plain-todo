name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Sources/PlainApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" Sources/PlainApp/Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -scheme PlainApp

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme PlainApp \
            -only-testing:PlainAppTests \
            -destination 'platform=macOS' \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.version }} \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme PlainApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.version }} \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath ./build/Plain.xcarchive \
            -quiet

      - name: Package
        run: |
          cd ./build/Plain.xcarchive/Products/Applications
          zip -r -y ../../../../Plain-${{ steps.version.outputs.tag }}-macOS.zip Plain.app

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.6.4"
          mkdir -p /tmp/sparkle
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar xJ -C /tmp/sparkle

      - name: Sign update with EdDSA
        id: sign
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_EDDSA_PRIVATE_KEY" > /tmp/sparkle_key
          RESULT=$(/tmp/sparkle/bin/sign_update "Plain-${{ steps.version.outputs.tag }}-macOS.zip" -f /tmp/sparkle_key)
          rm -f /tmp/sparkle_key
          echo "Signature output: $RESULT"
          SIGNATURE=$(echo "$RESULT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$RESULT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          echo "signature=${SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "length=${LENGTH}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Plain-${{ steps.version.outputs.tag }}-macOS.zip
          generate_release_notes: true

      - name: Update appcast on gh-pages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SIGNATURE="${{ steps.sign.outputs.signature }}"
          LENGTH="${{ steps.sign.outputs.length }}"
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DOWNLOAD_URL="https://github.com/danmunz/plain-todo/releases/download/${TAG}/Plain-${TAG}-macOS.zip"

          NEW_ITEM="    <item>
              <title>Version ${VERSION}</title>
              <sparkle:version>${VERSION}</sparkle:version>
              <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              <pubDate>${PUB_DATE}</pubDate>
              <enclosure
                url=\"${DOWNLOAD_URL}\"
                length=\"${LENGTH}\"
                type=\"application/octet-stream\"
                sparkle:edSignature=\"${SIGNATURE}\"
              />
            </item>"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git stash push --include-untracked --message "release workflow generated files"
          git checkout gh-pages

          if [ -f appcast.xml ]; then
            # Insert new item before closing </channel>
            printf '%s\n' "$NEW_ITEM" > appcast_item.xml
            awk 'FNR == NR { item = item $0 ORS; next } /<\/channel>/ { printf "%s", item } { print }' appcast_item.xml appcast.xml > appcast_tmp.xml
            mv appcast_tmp.xml appcast.xml
          else
            cat > appcast.xml <<APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Plain Updates</title>
              <link>https://danmunz.github.io/plain-todo/appcast.xml</link>
              <description>Most recent updates for Plain.</description>
              <language>en</language>
          ${NEW_ITEM}
            </channel>
          </rss>
          APPCAST_EOF
          fi

          git add appcast.xml
          git commit -m "Update appcast for ${TAG}"
          git push origin gh-pages
