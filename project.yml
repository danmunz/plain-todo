name: Plain
options:
  bundleIdPrefix: com.danmunz
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  PlainCore:
    type: framework
    platform: macOS
    sources:
      - Sources/PlainCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmunz.Plain.PlainCore
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  PlainApp:
    type: application
    platform: macOS
    sources:
      - Sources/PlainApp
    resources:
      - Sources/PlainApp/Resources
    dependencies:
      - target: PlainCore
      - target: PlainWidgetExtension
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmunz.Plain
        PRODUCT_NAME: Plain
        MARKETING_VERSION: 0.0.0-dev
        CURRENT_PROJECT_VERSION: 0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/PlainApp/Info.plist
      properties:
        NSAccentColorName: AccentColor
        SUFeedURL: https://danmunz.github.io/plain-todo/appcast.xml
        SUPublicEDKey: K3gSFhIl7Yo9Z9v4Mq+goU3+wxJFSOWqrVQrqW8onF4=
        CFBundleURLTypes:
          - CFBundleURLName: com.danmunz.Plain
            CFBundleURLSchemes:
              - plain
  PlainWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/PlainWidgetExtension
    dependencies:
      - target: PlainCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmunz.Plain.WidgetExtension
        PRODUCT_NAME: PlainWidgetExtension
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Sources/PlainWidgetExtension/Info.plist
  PlainCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PlainCoreTests
    resources:
      - Tests/PlainCoreTests/Fixtures
    dependencies:
      - target: PlainCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmunz.Plain.PlainCoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  PlainAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PlainAppTests
    dependencies:
      - target: PlainApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmunz.Plain.PlainAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Plain.app/Contents/MacOS/Plain
        BUNDLE_LOADER: $(TEST_HOST)
  PlainUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PlainUITests
    dependencies:
      - target: PlainApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmunz.Plain.PlainUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PlainApp
schemes:
  PlainApp:
    build:
      targets:
        PlainApp: all
        PlainWidgetExtension: all
        PlainCore: all
        PlainCoreTests: [test]
        PlainAppTests: [test]
        PlainUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PlainCoreTests
        - PlainAppTests
        - PlainUITests
